<!-- templates/reset_password.html -->
{% extends "layout.html" %}

{% block content %}
<h2>비밀번호 재설정</h2>
<p>새로운 비밀번호를 입력하세요.</p>

<form method="post">
    <div>
        <label for="password">새 비밀번호</label>
        <input type="password" name="password" id="password" required>
    </div>
    <button type="submit">비밀번호 변경</button>
</form>

<a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
{% endblock %}
