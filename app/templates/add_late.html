{% extends "layout.html" %}
{% block content %}

<h1>⏰ 지각 기록</h1>

<form method="POST">
  <div>
    <label>직원</label>
    <select name="user_id">
      {% for user in users %}
        <option value="{{ user.id }}">{{ user.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label>날짜</label>
    <input type="date" name="date" value="{{ att.date if att else current_date }}" required>
  </div>

  <div>
    <label>정시 출근 시간</label>
    <input type="time" name="start_time" value="{{ att.start_time if att else '09:00' }}" required>
  </div>

  <div>
    <label>실제 출근 시간</label>
    <input type="time" name="end_time" required>
  </div>

  <button type="submit">지각 등록</button>
</form>

{% endblock %}
