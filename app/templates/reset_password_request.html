<!-- templates/reset_password_request.html -->
{% extends "layout.html" %}

{% block content %}
<h1>비밀번호 재설정 요청</h1>
<p>가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>

<form method="post">
    <div>
        <label for="email">이메일</label>
        <input type="email" name="email" id="email" required>
    </div>
    <button type="submit">링크 보내기</button>
</form>

<a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
{% endblock %}
